<style>
  /* Hide scroll-to-top rocket button */
  [data-scroll-top],
  .scroll-top,
  #scroll-top,
  .back-to-top,
  #back-to-top,
  button[aria-label="Scroll to top"],
  a[aria-label="Scroll to top"],
  button[aria-label="Back to top"],
  a[aria-label="Back to top"] {
    display: none !important;
  }

  /* Social links in bio: force 3 icons per row (3×48px + 2×16px gap = 176px) */
  .flex.flex-wrap.justify-center.gap-4 {
    max-width: 11rem;
    margin-left: auto;
    margin-right: auto;
  }

  /* resume-biography-3 hard-codes the Interests heading at text-xl while the
     summary and Education headings grow to text-2xl/text-3xl, so Interests looks
     undersized on wide screens. It is the only h3 in the block without the
     responsive classes; give it the same scale (Tailwind v4 sizes/breakpoints). */
  .resume-biography h3.text-xl:not(.sm\:text-2xl) {
    font-size: 1.25rem;
    line-height: calc(1.75 / 1.25);
  }
  @media (min-width: 40rem) {
    .resume-biography h3.text-xl:not(.sm\:text-2xl) {
      font-size: 1.5rem;
      line-height: calc(2 / 1.5);
    }
  }
  @media (min-width: 64rem) {
    .resume-biography h3.text-xl:not(.sm\:text-2xl) {
      font-size: 1.875rem;
      line-height: calc(2.25 / 1.875);
    }
  }

  /* Organisation logos are single-ink artwork, so one of the two themes always
     swallows them. Flip them to a solid silhouette in the theme where they would
     otherwise disappear, and keep the original colours in the theme that works.
     Set `logo_mono: dark|light` on an education/experience entry to opt in. */
  .logo-ink-dark {
    filter: none;
  }
  .dark .logo-ink-dark {
    filter: brightness(0) invert(1);
  }
  .logo-ink-light {
    filter: brightness(0);
  }
  .dark .logo-ink-light {
    filter: none;
  }
</style>
