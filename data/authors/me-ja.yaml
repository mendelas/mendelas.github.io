  ## 身体性を持つ自律のための無線インテリジェンス

  ロボティクス・自動化・無線インテリジェンスの交点にあるPhysical AIを探究し，物理世界を認識・理解し，物理世界と相互作用する自律システムの構築に取り組んでいる．

