# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name (set in params.yaml under hugoblox.branding.name)
title: ''
# Website URL
baseURL: 'https://mendelas.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: true
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## PAGE OPTIONS
############################

cascade:
  - target:
      path: /slides/**
      kind: page
    outputs: [HTML, present]

############################
## ADVANCED
############################

build:
  writeStats: true
enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
disableAliases: true
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 90
  webp:
    quality: 90
    hint: picture
  avif:
    quality: 90
    hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
  exec:
    # Hugo dropped '^tailwindcss$' from the default security.exec.allow list, but
    # blox calls css.TailwindCSS, which execs the Tailwind CLI. The list replaces
    # the default rather than extending it, so repeat Hugo's defaults here.
    # https://gohugo.io/functions/css/tailwindcss/
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
sitemap:
  _merge: deep
